<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161E27"/>
      <stop offset="50%" stop-color="#0E141B"/>
      <stop offset="100%" stop-color="#080B0F"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB86C"/>
      <stop offset="50%" stop-color="#FF7628"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#C5CCD3"/>
      <stop offset="100%" stop-color="#7A889B"/>
    </linearGradient>
    <filter id="sparkGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGrad)" stroke="#29333D" stroke-width="8"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="#1F2937" stroke-width="4" stroke-dasharray="12 8"/>
  <circle cx="256" cy="256" r="160" fill="#111820" stroke="url(#steelGrad)" stroke-width="2" opacity="0.3"/>

  <!-- Stylized Geometric L with Stainless Steel Gradient -->
  <path d="M190 140 L245 140 L245 310 L335 310 L335 365 L190 365 Z" fill="url(#steelGrad)" />
  <path d="M190 140 L235 140 L235 320 L325 320 L325 365 L190 365 Z" fill="url(#orangeGrad)" opacity="0.75" />

  <!-- Welding Sparks & Starburst -->
  <g filter="url(#sparkGlow)">
    <circle cx="335" cy="310" r="16" fill="#FFFFFF"/>
    <circle cx="335" cy="310" r="26" fill="#FFB86C" opacity="0.8"/>
    <circle cx="335" cy="310" r="40" fill="#FF7628" opacity="0.4"/>

    <line x1="335" y1="230" x2="335" y2="390" stroke="#FFF" stroke-width="4" stroke-linecap="round"/>
    <line x1="255" y1="310" x2="415" y2="310" stroke="#FFF" stroke-width="4" stroke-linecap="round"/>
    <line x1="280" y1="255" x2="390" y2="365" stroke="#FFB86C" stroke-width="3" stroke-linecap="round"/>
    <line x1="390" y1="255" x2="280" y2="365" stroke="#FFB86C" stroke-width="3" stroke-linecap="round"/>

    <circle cx="390" cy="235" r="5" fill="#FFB86C"/>
    <circle cx="410" cy="275" r="4" fill="#FF7628"/>
    <circle cx="360" cy="205" r="5" fill="#FFFFFF"/>
    <circle cx="420" cy="340" r="5" fill="#FF8F3D"/>
    <circle cx="380" cy="375" r="4" fill="#FFB86C"/>
  </g>

  <text x="256" y="435" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="900" fill="#C5CCD3" letter-spacing="4">WELDING</text>
</svg>